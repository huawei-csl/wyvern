# Copy this file to `secret.toml` and fill in your own values.
# `secret.toml` is gitignored and must never be committed.

[retriever]
SERPER_API_KEY = "<your-serper-api-key>"  # https://serper.dev

[inference]
# OpenAI-compatible endpoint for the main report-generation model.
BASE_URL = "<your-openai-compatible-base-url>"
API_KEY = "<your-api-key>"

# Endpoint for the reasoning model. May be identical to the above if a single
# provider serves both models.
REASONING_BASE_URL = "<your-openai-compatible-base-url>"
REASONING_API_KEY = "<your-api-key>"